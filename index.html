<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision - Trạm Kiểm Soát Dụng Cụ</title>
    <!-- Tải thư viện ONNX Runtime Web từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f3f4f6; 
            margin: 0; 
            padding: 20px; 
            color: #1f2937; 
            overflow-x: hidden; 
        }
        
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
        }
        
        h2 { 
            text-align: center; 
            color: #1e3a8a; 
            margin-bottom: 5px; 
        }
        
        .subtitle { 
            text-align: center; 
            color: #6b7280; 
            margin-bottom: 25px; 
            font-size: 14px; 
        }
        
        .image-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 25px; 
        }
        
        .image-box { 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
            border: 2px dashed #d1d5db; 
            padding: 15px; 
            border-radius: 8px; 
            background: #fafafa; 
        }
        
        .image-box label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #374151; 
        }

        .image-box input[type="file"] {
            max-width: 100%; 
            margin-bottom: 10px;
        }
        
        canvas { 
            max-width: 100%; 
            height: auto !important; 
            border-radius: 6px; 
            display: none; 
            margin: 10px auto 0 auto; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        }
        
        button { 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            transition: all 0.2s; 
            box-shadow: 0 4px 6px -1px rgba(37,99,235,0.2); 
            max-width: 600px; 
            display: block;
            margin: 0 auto;
        }
        
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        
        .btn-save {
            background-color: #10b981; 
            margin-top: 15px;
            display: none; 
        }
        .btn-save:hover { background-color: #059669; }
        .btn-save-error { background-color: #ef4444; }
        .btn-save-error:hover { background-color: #dc2626; }

        .status-bar { 
            text-align: center; 
            margin-top: 15px; 
            margin-bottom: 20px;
            font-weight: 500; 
            padding: 15px; 
            border-radius: 6px; 
            background-color: #e5e7eb; 
            color: #374151; 
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            font-size: 16px;
        }
        
        .status-ready { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0;}
        .status-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca;}
        
        #resultPanel { display: none; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; border-radius: 8px; }
            h2 { font-size: 1.3rem; }
            .subtitle { font-size: 12px; margin-bottom: 15px; }
            button { padding: 12px 15px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trạm Kiểm Soát Dụng Cụ</h2>
    <div class="subtitle">YOLOv8 ONNX (Local) - Đối chiếu số lượng VÀO / RA</div>

    <div id="modelStatus" class="status-bar">Đang tải mô hình ONNX... Vui lòng đợi!</div>

    <div class="image-container">
        <!-- Ảnh VÀO -->
        <div class="image-box">
            <label>1. Ảnh chụp lúc VÀO (Check-in)</label>
            <input type="file" id="imageIn" accept="image/jpeg, image/png, image/jpg" capture="environment" onchange="previewImage(event, 'canvasIn', 'in')">
            <canvas id="canvasIn"></canvas>
        </div>

        <!-- Ảnh RA -->
        <div class="image-box">
            <label>2. Ảnh chụp lúc RA (Check-out)</label>
            <input type="file" id="imageOut" accept="image/jpeg, image/png, image/jpg" capture="environment" onchange="previewImage(event, 'canvasOut', 'out')">
            <canvas id="canvasOut"></canvas>
        </div>

        <button id="checkButton" onclick="analyzeImages()" disabled>KÍCH HOẠT QUÉT ĐỐI TƯỢNG</button>
        
        <!-- Bảng thông báo kết quả so sánh -->
        <div id="resultPanel" class="status-bar"></div>

        <!-- Nút Lưu Kết Quả -->
        <button id="saveButton" class="btn-save" onclick="saveToSharePoint()">LƯU KẾT QUẢ</button>
    </div>
</div>

<script>
    // ==========================================
    // CẤU HÌNH YOLOV8 & WEBHOOK
    // ==========================================
    const MODEL_PATH = "./best.onnx"; 
    const CONFIDENCE_THRESHOLD = 0.8; 
    const IOU_THRESHOLD = 0.45;        
    const MODEL_INPUT_SIZE = 640;      

    // Dán URL Webhook từ Power Automate vào đây
    const SHAREPOINT_WEBHOOK_URL = "https://prod-xx.westeurope.logic.azure.com:443/workflows/xxxx..."; 

    // Biến toàn cục
    let session = null;
    let imgInObj = null;
    let imgOutObj = null;
    let detectedCountIn = 0;
    let detectedCountOut = 0;

    // Danh sách nhãn Dụng cụ (Cập nhật chuẩn theo model của bạn)
    const TOOL_LABELS = [
        "co_le", 
        "Bo_co_le_dtt",
        "Bo_dau_khau",	
        "Bo_luc_giac",	
        "Bua_cao_su",
        "Bua_kim_loai",
        "Cao_2_chau",
        "Co_le",
        "Dong_ho_dien",
        "Kim_kep",
        "Kim_tuot_day",
        "May_bom_mo_milwaukee",	
        "Mo_let_rang",
        "Ni_vo",
        "Sung_ban_keo",	
        "Thuoc_chu_T",
        "Thuoc_kep"
    ];

    // 1. KHỞI TẠO MÔ HÌNH ONNX
    async function initModel() {
        try {
            ort.env.wasm.numThreads = 1; 
            session = await ort.InferenceSession.create(MODEL_PATH, { executionProviders: ['wasm'] });
            
            const statusDiv = document.getElementById('modelStatus');
            statusDiv.textContent = "✅ Ứng dụng đã sẵn sàng!";
            statusDiv.classList.add('status-ready');
            document.getElementById('checkButton').disabled = false;
        } catch (error) {
            console.error(error);
            const statusDiv = document.getElementById('modelStatus');
            statusDiv.textContent = "❌ Lỗi tải mô hình! Hãy kiểm tra lại file best.onnx";
            statusDiv.classList.add('status-error');
        }
    }

    window.onload = initModel;

    // 2. HIỂN THỊ ẢNH GỐC
    function previewImage(event, canvasId, imgKey) {
        const file = event.target.files[0];
        if (file) {
            const img = new Image();
            img.onload = function() {
                if (imgKey === 'in') imgInObj = img;
                if (imgKey === 'out') imgOutObj = img;
                drawImageOnCanvas(canvasId, img);
                
                // Ẩn bảng kết quả và nút lưu khi có ảnh mới
                document.getElementById('resultPanel').style.display = 'none';
                document.getElementById('saveButton').style.display = 'none';

                URL.revokeObjectURL(img.src);
            }
            img.onerror = function() { alert("Không thể tải ảnh. Vui lòng thử lại!"); }
            img.src = URL.createObjectURL(file);
        }
    }

    function drawImageOnCanvas(canvasId, imgObj) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const maxDim = 600;
        let width = imgObj.width;
        let height = imgObj.height;

        if (width > maxDim || height > maxDim) {
            if (width > height) { height = (maxDim / width) * height; width = maxDim; } 
            else { width = (maxDim / height) * width; height = maxDim; }
        }
        canvas.width = width;
        canvas.height = height;
        canvas.style.display = 'block';
        ctx.drawImage(imgObj, 0, 0, width, height);
    }

    // 3. TIỀN XỬ LÝ ẢNH
    function preprocessImage(imgObj) {
        const canvas = document.createElement('canvas');
        canvas.width = MODEL_INPUT_SIZE;
        canvas.height = MODEL_INPUT_SIZE;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgObj, 0, 0, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE);
        const imgData = ctx.getImageData(0, 0, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE).data;

        const float32Data = new Float32Array(3 * MODEL_INPUT_SIZE * MODEL_INPUT_SIZE);
        for (let i = 0; i < MODEL_INPUT_SIZE * MODEL_INPUT_SIZE; i++) {
            float32Data[i] = imgData[i * 4] / 255.0;                                        
            float32Data[i + MODEL_INPUT_SIZE * MODEL_INPUT_SIZE] = imgData[i * 4 + 1] / 255.0;      
            float32Data[i + 2 * MODEL_INPUT_SIZE * MODEL_INPUT_SIZE] = imgData[i * 4 + 2] / 255.0;  
        }
        return new ort.Tensor('float32', float32Data, [1, 3, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE]);
    }

    // 4. CHẠY SUY LUẬN, HẬU XỬ LÝ & TRẢ VỀ SỐ LƯỢNG TOOL
    async function detectObjects(imgObj, canvasId) {
        if (!session) return 0;

        const tensor = preprocessImage(imgObj);
        const feeds = {};
        feeds[session.inputNames[0]] = tensor;
        const results = await session.run(feeds);
        
        const outputTensor = results[session.outputNames[0]];
        const outputData = outputTensor.data;
        
        const numClasses = outputTensor.dims[1] - 4; 
        const numAnchors = outputTensor.dims[2];     

        let boxes = [];

        for (let i = 0; i < numAnchors; i++) {
            let maxClassScore = 0;
            let classId = -1;

            for (let c = 0; c < numClasses; c++) {
                let score = outputData[(4 + c) * numAnchors + i];
                if (score > maxClassScore) {
                    maxClassScore = score;
                    classId = c;
                }
            }

            if (maxClassScore >= CONFIDENCE_THRESHOLD) {
                let xc = outputData[0 * numAnchors + i]; 
                let yc = outputData[1 * numAnchors + i]; 
                let w = outputData[2 * numAnchors + i];  
                let h = outputData[3 * numAnchors + i];  

                let x1 = xc - w / 2;
                let y1 = yc - h / 2;
                let x2 = xc + w / 2;
                let y2 = yc + h / 2;

                boxes.push({ x1, y1, x2, y2, score: maxClassScore, classId: classId });
            }
        }

        boxes = applyNMS(boxes, IOU_THRESHOLD);
        drawBoxes(canvasId, imgObj, boxes);
        
        // Trả về số lượng object phát hiện được
        return boxes.length;
    }

    // 5. THUẬT TOÁN NMS
    function applyNMS(boxes, iouThreshold) {
        if (boxes.length === 0) return [];
        boxes.sort((a, b) => b.score - a.score);
        
        const selected = [];
        while (boxes.length > 0) {
            const current = boxes.shift();
            selected.push(current);
            boxes = boxes.filter(box => {
                if (box.classId !== current.classId) return true;
                const iou = calculateIoU(current, box);
                return iou < iouThreshold;
            });
        }
        return selected;
    }

    function calculateIoU(box1, box2) {
        const x_left = Math.max(box1.x1, box2.x1);
        const y_top = Math.max(box1.y1, box2.y1);
        const x_right = Math.min(box1.x2, box2.x2); 
        const y_bottom = Math.min(box1.y2, box2.y2); 

        if (x_right < x_left || y_bottom < y_top) return 0.0;

        const intersection = (x_right - x_left) * (y_bottom - y_top);
        const area1 = (box1.x2 - box1.x1) * (box1.y2 - box1.y1);
        const area2 = (box2.x2 - box2.x1) * (box2.y2 - box2.y1);
        
        return intersection / (area1 + area2 - intersection);
    }

    // HÀM ÁNH XẠ NHÃN THEO DANH SÁCH TOOL
    function getClassName(classId) {
        return TOOL_LABELS[classId] || `Unknown (${classId})`;
    }

    // 6. VẼ KHUNG ĐỊNH VỊ
    function drawBoxes(canvasId, imgObj, boxes) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');

        const scaleX = canvas.width / MODEL_INPUT_SIZE;
        const scaleY = canvas.height / MODEL_INPUT_SIZE;

        boxes.forEach(box => {
            const x = box.x1 * scaleX;
            const y = box.y1 * scaleY;
            const w = (box.x2 - box.x1) * scaleX;
            const h = (box.y2 - box.y1) * scaleY;

            ctx.strokeStyle = '#dc2626'; 
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);

            const labelText = getClassName(box.classId);
            
            ctx.font = 'bold 13px "Segoe UI", Arial, sans-serif';
            ctx.textBaseline = 'top';

            const textWidth = ctx.measureText(labelText).width + 10; 
            const labelHeight = 22;
            const labelY = (y - labelHeight < 0) ? y : y - labelHeight;

            ctx.fillStyle = '#dc2626';
            ctx.fillRect(x, labelY, textWidth, labelHeight);
            ctx.fillStyle = 'white';
            ctx.fillText(labelText, x + 5, labelY + 4);
        });
    }

    // LUỒNG CHẠY QUÉT VÀ SO SÁNH SỐ LƯỢNG
    async function analyzeImages() {
        if (!imgInObj || !imgOutObj) {
            alert("Vui lòng tải lên đủ cả hai hình ảnh VÀO và RA!");
            return;
        }

        const btn = document.getElementById('checkButton');
        btn.disabled = true;
        btn.innerText = "ĐANG PHÂN TÍCH...";

        // Reset lại canvas trước khi quét
        drawImageOnCanvas('canvasIn', imgInObj);
        drawImageOnCanvas('canvasOut', imgOutObj);

        try {
            // Lấy ra số lượng tool ở 2 ảnh
            detectedCountIn = await detectObjects(imgInObj, 'canvasIn');
            detectedCountOut = await detectObjects(imgOutObj, 'canvasOut');
            
            // Xử lý Hiển thị So sánh
            const resultPanel = document.getElementById('resultPanel');
            const saveBtn = document.getElementById('saveButton');
            
            resultPanel.style.display = 'block';
            saveBtn.style.display = 'block';
            saveBtn.disabled = false;

            if (detectedCountIn === detectedCountOut) {
                resultPanel.innerHTML = `✅ <strong>KHỚP SỐ LƯỢNG!</strong><br>Check-in: <b>${detectedCountIn}</b> tool ➖ Check-out: <b>${detectedCountOut}</b> tool`;
                resultPanel.className = 'status-bar status-ready';
                
                saveBtn.innerText = "LƯU KẾT QUẢ (ĐẠT)";
                saveBtn.classList.remove('btn-save-error');
            } else {
                resultPanel.innerHTML = `❌ <strong>CẢNH BÁO: LỆCH SỐ LƯỢNG!</strong><br>Check-in: <b>${detectedCountIn}</b> tool ➖ Check-out: <b>${detectedCountOut}</b> tool`;
                resultPanel.className = 'status-bar status-error';
                
                saveBtn.innerText = "LƯU KẾT QUẢ (LỆCH)";
                saveBtn.classList.add('btn-save-error');
            }

        } catch (err) {
            console.error("Lỗi khi quét ảnh:", err);
            alert("Có lỗi xảy ra trong lúc quét. Vui lòng xem Console (F12).");
        } finally {
            btn.disabled = false;
            btn.innerText = "KÍCH HOẠT QUÉT ĐỐI TƯỢNG";
        }
    }

    // ==========================================
    // 7. GỬI DỮ LIỆU LÊN SHAREPOINT
    // ==========================================
    async function saveToSharePoint() {
        if (SHAREPOINT_WEBHOOK_URL.includes("THAY_LINK")) {
            alert("Bạn cần cập nhật SHAREPOINT_WEBHOOK_URL!");
            return;
        }

        const btnSave = document.getElementById('saveButton');
        const originalText = btnSave.innerText;
        btnSave.innerText = "ĐANG GỬI DỮ LIỆU...";
        btnSave.disabled = true;

        const canvasIn = document.getElementById('canvasIn');
        const canvasOut = document.getElementById('canvasOut');
        
        const base64In = canvasIn.toDataURL('image/jpeg', 0.8).split(',')[1];
        const base64Out = canvasOut.toDataURL('image/jpeg', 0.8).split(',')[1];

        const isMatch = (detectedCountIn === detectedCountOut);

        const payload = {
            status: isMatch ? "Đạt" : "Lệch",
            toolCountIn: detectedCountIn,
            toolCountOut: detectedCountOut,
            timestamp: new Date().toISOString(),
            imageIn_Base64: base64In,
            imageOut_Base64: base64Out
        };

        try {
            const response = await fetch(SHAREPOINT_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok || response.status === 202) {
                alert("Đã lưu thành công vào SharePoint!");
                btnSave.innerText = "ĐÃ LƯU THÀNH CÔNG ✓";
            } else {
                alert("Gặp lỗi khi lưu lên máy chủ: " + response.statusText);
                btnSave.innerText = originalText;
                btnSave.disabled = false;
            }
        } catch (error) {
            console.error("Lỗi mạng:", error);
            alert("Không thể kết nối đến máy chủ SharePoint/Power Automate.");
            btnSave.innerText = originalText;
            btnSave.disabled = false;
        }
    }
</script>

<script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
<script>
  var vConsole = new window.VConsole();
</script>
    
</body>
</html>
